<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 270" width="1120" height="270">
  <defs>
    <linearGradient id="kraft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E8D5"/>
      <stop offset="55%" stop-color="#EADBC2"/>
      <stop offset="100%" stop-color="#E2CEAF"/>
    </linearGradient>
    <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feComponentTransfer in="gray" result="soft">
        <feFuncA type="linear" slope="0.065"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" in2="soft"/>
    </filter>
    <pattern id="ruled" width="28" height="28" patternUnits="userSpaceOnUse">
      <line x1="0" y1="28" x2="28" y2="28" stroke="#9C8468" stroke-width="0.6" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- Kraft paper base -->
  <rect x="2" y="2" width="1116" height="266" rx="10" fill="url(#kraft-bg)" filter="url(#paper-grain)"/>
  <rect x="2" y="2" width="1116" height="266" rx="10" fill="url(#ruled)"/>

  <!-- Editorial double border -->
  <rect x="2" y="2" width="1116" height="266" rx="10" fill="none" stroke="#9C8468" stroke-width="1.5"/>
  <rect x="12" y="12" width="1096" height="246" rx="6" fill="none" stroke="#B79E7F" stroke-width="0.9" stroke-dasharray="5 3"/>

  <!-- Left margin vertical red-ochre ledger line -->
  <line x1="42" y1="12" x2="42" y2="258" stroke="#B35C44" stroke-width="1.1" opacity="0.45"/>
  <line x1="46" y1="12" x2="46" y2="258" stroke="#B35C44" stroke-width="0.6" opacity="0.3"/>

  <!-- Top archive metadata bar -->
  <g transform="translate(68, 42)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#6F5B47" letter-spacing="1.1">
    <text x="0" y="0">ARCHIVE NO. USTC-QB-01</text>
    <text x="206" y="0" fill="#A68B6B">/</text>
    <text x="224" y="0">RELEASE v0.1.0</text>
    <text x="362" y="0" fill="#A68B6B">/</text>
    <text x="380" y="0">SCHEMA 1.0 · UTF-8 JSONL</text>
  </g>

  <!-- Main serif title -->
  <g transform="translate(68, 108)">
    <text x="0" y="0" fill="#261C15" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif SC', serif" font-size="48" font-weight="700" letter-spacing="-0.6">USTC-Question-Bank</text>
    <text x="2" y="36" fill="#594738" font-family="'Songti SC', 'Noto Serif SC', 'STSong', Georgia, serif" font-size="17.5" letter-spacing="0.4">中国科学技术大学本科课程结构化题库  ·  可编程数据底座</text>
  </g>

  <!-- Bottom archival metric stamps -->
  <g transform="translate(68, 188)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
    <rect x="0" y="0" width="122" height="34" rx="4" fill="#F7F0E2" stroke="#B39B7D" stroke-width="1"/>
    <text x="14" y="21.5" fill="#4A3A2D"><tspan fill="#9E3B2B" font-weight="700">03</tspan> Courses</text>

    <rect x="134" y="0" width="166" height="34" rx="4" fill="#F7F0E2" stroke="#B39B7D" stroke-width="1"/>
    <text x="148" y="21.5" fill="#4A3A2D"><tspan fill="#1E4E79" font-weight="700">1,585</tspan> Questions</text>

    <rect x="312" y="0" width="144" height="34" rx="4" fill="#F7F0E2" stroke="#B39B7D" stroke-width="1"/>
    <text x="326" y="21.5" fill="#4A3A2D"><tspan fill="#2F6B4F" font-weight="700">100%</tspan> Solved</text>

    <rect x="468" y="0" width="148" height="34" rx="4" fill="#F7F0E2" stroke="#B39B7D" stroke-width="1"/>
    <text x="482" y="21.5" fill="#4A3A2D"><tspan fill="#6E4E2E" font-weight="700">94</tspan> KP Nodes</text>
  </g>

  <!-- Right-side library index card -->
  <g transform="translate(792, 36)">
    <rect x="0" y="0" width="278" height="196" rx="6" fill="#F8F2E6" stroke="#A68D70" stroke-width="1.2"/>
    <line x1="0" y1="36" x2="278" y2="36" stroke="#C5AE90" stroke-width="1"/>
    <line x1="0" y1="74" x2="278" y2="74" stroke="#DFCBB0" stroke-width="0.9"/>
    <line x1="0" y1="112" x2="278" y2="112" stroke="#DFCBB0" stroke-width="0.9"/>
    <line x1="0" y1="150" x2="278" y2="150" stroke="#DFCBB0" stroke-width="0.9"/>

    <!-- Index card header -->
    <text x="16" y="23" fill="#78614B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="0.8">INDEX / COURSES</text>
    <!-- Red archive seal -->
    <rect x="218" y="9" width="46" height="18" rx="2" fill="none" stroke="#9E3B2B" stroke-width="1.2"/>
    <text x="241" y="21.5" text-anchor="middle" fill="#9E3B2B" font-family="'Songti SC', 'Noto Serif SC', serif" font-size="10.5" font-weight="700">科大</text>

    <!-- Course rows -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#2E231B">
      <text x="16" y="60" font-weight="700" fill="#1E4E79">001548</text>
      <text x="98" y="60" font-family="'Songti SC', 'Noto Serif SC', serif" font-size="13">复变函数B</text>
      <text x="262" y="60" text-anchor="end" fill="#6F5B47">571</text>

      <text x="16" y="98" font-weight="700" fill="#1E4E79">MATH1006</text>
      <text x="98" y="98" font-family="'Songti SC', 'Noto Serif SC', serif" font-size="13">数学分析(B1)</text>
      <text x="262" y="98" text-anchor="end" fill="#6F5B47">445</text>

      <text x="16" y="136" font-weight="700" fill="#1E4E79">MATH1007</text>
      <text x="98" y="136" font-family="'Songti SC', 'Noto Serif SC', serif" font-size="13">数学分析(B2)</text>
      <text x="262" y="136" text-anchor="end" fill="#6F5B47">569</text>
    </g>

    <text x="16" y="177" fill="#8C755C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">+ PR welcome for more courses</text>
  </g>
</svg>
