<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 240" width="260" height="240">
  <rect width="260" height="240" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111"/>
    </marker>
  </defs>
  <!-- Turntable disk -->
  <circle cx="120" cy="125" r="88" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Axes x, y -->
  <line x1="120" y1="125" x2="238" y2="125" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="120" y1="125" x2="120" y2="18" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="241" y="130" font-family="serif" font-style="italic" font-size="16" fill="#111">x</text>
  <text x="102" y="25" font-family="serif" font-style="italic" font-size="16" fill="#111">y</text>
  <text x="101" y="140" font-family="serif" font-style="italic" font-size="16" fill="#111">O</text>
  <!-- Ball at r = 6 m on +x axis -->
  <circle cx="176" cy="125" r="7" fill="#111"/>
  <text x="164" y="110" font-family="serif" font-size="14" fill="#111">2 kg</text>
  <!-- Distance 6 m -->
  <line x1="120" y1="145" x2="176" y2="145" stroke="#444" stroke-width="1.2"/>
  <line x1="120" y1="140" x2="120" y2="150" stroke="#444" stroke-width="1.2"/>
  <line x1="176" y1="140" x2="176" y2="150" stroke="#444" stroke-width="1.2"/>
  <text x="137" y="164" font-family="serif" font-size="14" fill="#111">6 m</text>
  <!-- Omega arrow -->
  <path d="M 192 62 A 98 98 0 0 0 162 40" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="184" y="42" font-family="serif" font-style="italic" font-size="16" fill="#111">ω</text>
</svg>
