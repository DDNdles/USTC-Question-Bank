<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" width="320" height="270">
  <rect width="320" height="270" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111"/>
    </marker>
  </defs>
  <!-- Ceiling and floor -->
  <line x1="70" y1="22" x2="290" y2="22" stroke="#111" stroke-width="2"/>
  <line x1="25" y1="248" x2="295" y2="248" stroke="#111" stroke-width="2"/>
  <!-- Bracket & fixed pulley (top left) -->
  <polygon points="134,22 150,22 145,58 139,58" fill="#eee" stroke="#111" stroke-width="1.3"/>
  <circle cx="142" cy="58" r="28" fill="none" stroke="#111" stroke-width="1.8"/>
  <circle cx="142" cy="58" r="3" fill="#fff" stroke="#111" stroke-width="1.4"/>
  <!-- Rope left: fixed pulley left tangent (114,58) down to weight (94..134, 152..176) -->
  <line x1="114" y1="58" x2="114" y2="152" stroke="#111" stroke-width="1.6"/>
  <rect x="92" y="152" width="44" height="24" fill="#dcdcdc" stroke="#111" stroke-width="1.8"/>
  <rect x="97" y="156" width="34" height="16" fill="#fff" stroke="#111" stroke-width="1"/>
  <!-- Weight velocity v0 -->
  <line x1="114" y1="164" x2="114" y2="205" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="106" y="222" font-family="serif" font-style="italic" font-size="16" fill="#111">v<tspan dy="3" font-size="11">0</tspan></text>
  <!-- Height h from floor (248) to weight bottom (176) -->
  <line x1="66" y1="248" x2="66" y2="176" stroke="#111" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="88" y1="176" x2="60" y2="176" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="45" y="218" font-family="serif" font-style="italic" font-size="16" fill="#111">h</text>
  <!-- Rope middle: fixed pulley right tangent (170,58) down to movable pulley left tangent (170,174) -->
  <line x1="170" y1="58" x2="170" y2="174" stroke="#111" stroke-width="1.6"/>
  <!-- Movable pulley centered at (198,174), r=28 -->
  <circle cx="198" cy="174" r="28" fill="none" stroke="#111" stroke-width="1.8"/>
  <circle cx="198" cy="174" r="3.5" fill="#fff" stroke="#111" stroke-width="1.4"/>
  <!-- Rope right: movable pulley right tangent (226,174) up to ceiling (226,22) -->
  <line x1="226" y1="174" x2="226" y2="22" stroke="#111" stroke-width="1.6"/>
  <!-- Spring from movable pulley axle (198,177.5) down to floor (198,248) -->
  <polyline points="198,178 198,194 191,198 205,205 191,212 205,219 191,226 205,233 198,237 198,248" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="212" y="226" font-family="serif" font-style="italic" font-size="15" fill="#111">k</text>
</svg>
