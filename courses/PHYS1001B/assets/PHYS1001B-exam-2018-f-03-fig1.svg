<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" width="340" height="230">
  <rect width="340" height="230" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111"/>
    </marker>
  </defs>
  <!-- Pivot O at (270, 42) -->
  <circle cx="270" cy="42" r="4" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="280" y="45" font-family="serif" font-size="15" fill="#111">O</text>
  <!-- Angular velocity omega arc around O -->
  <path d="M 252 34 A 20 20 0 0 1 285 28" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="242" y="25" font-family="serif" font-style="italic" font-size="15" fill="#111">ω</text>
  <!-- Tube AB horizontal at y=165 from x=70 (B) to x=215 (A), dashed extension to (270, 165) -->
  <rect x="65" y="160" width="155" height="10" fill="#f8f8f8" stroke="#111" stroke-width="1.6"/>
  <line x1="220" y1="165" x2="270" y2="165" stroke="#555" stroke-width="1.1" stroke-dasharray="4,3"/>
  <!-- Perpendicular H from O(270,42) to (270,165) -->
  <line x1="270" y1="46" x2="270" y2="165" stroke="#111" stroke-width="1.3" stroke-dasharray="5,3"/>
  <polyline points="262,165 262,157 270,157" fill="none" stroke="#111" stroke-width="1.1"/>
  <text x="277" y="110" font-family="serif" font-style="italic" font-size="15" fill="#111">H</text>
  <!-- Segments OA = R1, OB = R2 -->
  <line x1="268" y1="45" x2="215" y2="160" stroke="#111" stroke-width="1.3"/>
  <line x1="267" y1="44" x2="72" y2="160" stroke="#111" stroke-width="1.3"/>
  <text x="220" y="98" font-family="serif" font-style="italic" font-size="15" fill="#111">R<tspan dy="3" font-size="11">1</tspan></text>
  <text x="148" y="96" font-family="serif" font-style="italic" font-size="15" fill="#111">R<tspan dy="3" font-size="11">2</tspan></text>
  <!-- Ball at A with velocity v1 toward B -->
  <circle cx="206" cy="165" r="4.5" fill="#111"/>
  <line x1="200" y1="165" x2="165" y2="165" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="176" y="153" font-family="serif" font-style="italic" font-size="14" fill="#111">v<tspan dy="3" font-size="10">1</tspan></text>
  <text x="213" y="186" font-family="serif" font-size="14" fill="#111">A</text>
  <text x="68" y="186" font-family="serif" font-size="14" fill="#111">B</text>
</svg>
