<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 230" width="310" height="230">
  <rect width="310" height="230" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="45" y1="195" x2="290" y2="195" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="45" y1="195" x2="45" y2="20" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="292" y="200" font-family="serif" font-style="italic" font-size="16" fill="#111">r</text>
  <text x="28" y="28" font-family="serif" font-style="italic" font-size="16" fill="#111">V</text>
  <!-- Linear gravity potential V_g = mgr cot alpha -->
  <line x1="45" y1="195" x2="275" y2="95" stroke="#666" stroke-width="1.4"/>
  <text x="235" y="125" font-family="serif" font-size="12" fill="#444">重力势能</text>
  <!-- Tangential kinetic term Lz^2/(2mr^2) -->
  <path d="M 60 35 Q 78 165 275 188" fill="none" stroke="#666" stroke-width="1.4"/>
  <text x="225" y="176" font-family="serif" font-size="12" fill="#444">切向动能</text>
  <!-- Effective potential V_eff = sum -->
  <path d="M 66 32 C 82 142 118 135 275 72" fill="none" stroke="#111" stroke-width="2.2"/>
  <text x="226" y="65" font-family="serif" font-size="13" fill="#111">有效势能</text>
  <!-- Energy level E > 0 intersecting at r_min and r_max -->
  <line x1="45" y1="100" x2="275" y2="100" stroke="#111" stroke-width="1.3" stroke-dasharray="6,4"/>
  <text x="12" y="104" font-family="serif" font-style="italic" font-size="14" fill="#111">E&gt;0</text>
  <!-- Vertical guides to r_min, r_max -->
  <line x1="87" y1="100" x2="87" y2="195" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="205" y1="100" x2="205" y2="195" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="87" cy="100" r="3" fill="#111"/>
  <circle cx="205" cy="100" r="3" fill="#111"/>
  <text x="77" y="213" font-family="serif" font-style="italic" font-size="14" fill="#111">r<tspan dy="3" font-size="10">min</tspan></text>
  <text x="194" y="213" font-family="serif" font-style="italic" font-size="14" fill="#111">r<tspan dy="3" font-size="10">max</tspan></text>
</svg>
