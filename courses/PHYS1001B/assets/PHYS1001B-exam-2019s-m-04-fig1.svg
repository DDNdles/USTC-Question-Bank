<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 270" width="280" height="270">
  <rect width="280" height="270" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111"/>
    </marker>
  </defs>
  <!-- Vertical z axis & bottom horizontal axis -->
  <line x1="140" y1="240" x2="140" y2="18" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="140" y1="240" x2="255" y2="240" stroke="#111" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="147" y="26" font-family="serif" font-style="italic" font-size="16" fill="#111">z</text>
  <text x="122" y="253" font-family="serif" font-style="italic" font-size="16" fill="#111">O</text>
  <!-- Inverted cone edges from O(140,240) -->
  <line x1="140" y1="240" x2="55" y2="55" stroke="#111" stroke-width="1.8"/>
  <line x1="140" y1="240" x2="225" y2="55" stroke="#111" stroke-width="1.8"/>
  <!-- Top rim ellipse -->
  <ellipse cx="140" cy="55" rx="85" ry="14" fill="none" stroke="#111" stroke-width="1.5"/>
  <!-- Two horizontal motion circles on cone wall -->
  <path d="M 78 105 A 62 10 0 0 0 202 105" fill="none" stroke="#333" stroke-width="1.3"/>
  <path d="M 78 105 A 62 10 0 0 1 202 105" fill="none" stroke="#333" stroke-width="1.1" stroke-dasharray="4,3"/>
  <path d="M 103 160 A 37 7 0 0 0 177 160" fill="none" stroke="#333" stroke-width="1.3"/>
  <path d="M 103 160 A 37 7 0 0 1 177 160" fill="none" stroke="#333" stroke-width="1.1" stroke-dasharray="4,3"/>
  <!-- Angle 2 alpha -->
  <path d="M 127 212 A 30 30 0 0 1 153 212" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="144" y="196" font-family="serif" font-style="italic" font-size="14" fill="#111">α</text>
  <!-- Particle P on wall -->
  <circle cx="182" cy="128" r="4.5" fill="#111"/>
  <text x="190" y="128" font-family="serif" font-style="italic" font-size="15" fill="#111">P</text>
  <!-- Horizontal r from axis to P -->
  <line x1="140" y1="128" x2="182" y2="128" stroke="#444" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="157" y="122" font-family="serif" font-style="italic" font-size="14" fill="#111">r</text>
</svg>
