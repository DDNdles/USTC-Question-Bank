    <text x="144" y="59" text-anchor="middle">D<tspan dy="3" font-size="10" font-style="normal">1</tspan></text>
    <text x="176" y="59" text-anchor="middle">D<tspan dy="3" font-size="10" font-style="normal">2</tspan></text>
    <text x="208" y="59" text-anchor="middle">D<tspan dy="3" font-size="10" font-style="normal">3</tspan></text>

