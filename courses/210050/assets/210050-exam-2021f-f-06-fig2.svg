    <!-- Top data inputs D0..D3 -->
    <line x1="112" y1="18" x2="112" y2="42"/>
    <line x1="144" y1="18" x2="144" y2="42"/>
    <line x1="176" y1="18" x2="176" y2="42"/>
    <line x1="208" y1="18" x2="208" y2="42"/>
